name: Run tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          SERVER=$(echo "${{ gitea.server_url }}" | sed 's|^https://||')
          git clone "https://oauth2:${{ secrets.GITEA_TOKEN }}@${SERVER}/${{ gitea.repository }}.git" .

      - name: T1 — Hook injection budget
        run: python3 _tests/test_hook_budget.py

      - name: T2 — Inject hooks
        run: python3 _tests/test_inject_hooks.py

      - name: T3 — Save conversation
        run: python3 _tests/test_save_conversation.py

      - name: T4 — Generate pending events
        run: python3 _tests/test_generate_pending_events.py

      - name: T5 — Generate dashboard
        run: python3 _tests/test_generate_dashboard.py

      - name: T6 — RAG embed
        run: python3 _tests/test_rag_embed.py

      - name: T7 — RAG search
        run: python3 _tests/test_rag_search.py

      - name: T8 — Inject context RAG
        run: python3 _tests/test_inject_context_rag.py

      - name: Notify failure
        if: failure() && secrets.NTFY_URL != ''
        run: |
          curl -s \
            -H "Title: Second Brain CI failure" \
            -d "❌ ${{ github.workflow }} failed on ${{ github.ref_name }} — ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_id }}" \
            ${{ secrets.NTFY_URL }}/${{ secrets.NTFY_TOPIC }}
