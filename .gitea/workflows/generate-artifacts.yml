name: Generate artifacts

on:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://oauth2:${{ secrets.GITEA_TOKEN }}@git.3etn.net/${{ gitea.repository }}.git .
          git config user.name "gitea-actions"
          git config user.email "actions@gitea"

      - name: Generate conversation index
        run: python3 _scripts/index-conversations.py

      - name: Generate project indexes
        run: python3 _scripts/update-project-indexes.py

      - name: Generate pending events
        run: python3 _scripts/generate-pending-events.py

      - name: Commit artifacts
        run: |
          git add _conversations/index.md _conversations/pending-events.md personal/ professional/ public/
          git diff --cached --quiet || git commit -m "chore: regenerate indexes and pending events"
          git push
