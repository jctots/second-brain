name: Generate artifacts

on:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          git clone https://oauth2:${{ secrets.GITEA_TOKEN }}@git.3etn.net/${{ gitea.repository }}.git .
          git config user.name "gitea-actions"
          git config user.email "actions@gitea"

      - name: Generate conversation index
        run: python3 _scripts/generate-conversation-index.py

      - name: Generate project indexes
        run: python3 _scripts/generate-project-indices.py

      - name: Generate dashboard
        run: python3 _scripts/generate-dashboard.py

      - name: Generate pending events
        run: python3 _scripts/generate-pending-events.py

      - name: Generate PDF sidecars
        run: pip install pdfplumber marker-pdf && python3 _scripts/generate-pdf-sidecars.py

      - name: Commit artifacts
        run: |
          git add _conversations/index.md _conversations/pending-events.md personal/ professional/ public/ dashboard.md
          git ls-files --others --exclude-standard | grep '\.md$' | xargs -r git add
          git diff --cached --quiet || git commit -m "chore: regenerate indexes, pending events, and PDF sidecars"
          git push
