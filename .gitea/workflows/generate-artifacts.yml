name: Generate artifacts

on:
  push:
    branches: [main]

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        run: |
          SERVER=$(echo "${{ gitea.server_url }}" | sed 's|^https://||')
          git clone "https://oauth2:${{ secrets.GITEA_TOKEN }}@${SERVER}/${{ gitea.repository }}.git" .
          git config user.name "gitea-actions"
          git config user.email "actions@gitea"

      - name: Generate conversation index
        id: conv_index
        run: python3 _scripts/generate-conversation-index.py

      - name: Generate project indexes
        id: proj_indexes
        run: python3 _scripts/generate-project-indices.py

      - name: Generate dashboard
        id: dashboard
        run: python3 _scripts/generate-dashboard.py

      - name: Generate pending events
        id: pending_events
        run: python3 _scripts/generate-pending-events.py

      - name: Cache pip packages
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: pip-pdf-pdfplumber-pytesseract

      - name: Generate PDF sidecars
        id: pdf_sidecars
        if: ${{ vars.PDF_SIDECARS_ENABLED == 'true' }}
        run: |
          apt-get update && apt-get install -y tesseract-ocr
          python3 -m venv /tmp/pdf-venv
          /tmp/pdf-venv/bin/pip install pdfplumber pytesseract pypdfium2
          /tmp/pdf-venv/bin/python3 _scripts/generate-pdf-sidecars.py

      - name: Commit artifacts
        id: commit
        run: |
          git add _conversations/index.md _conversations/pending-events.md personal/ professional/ public/ dashboard.md
          git ls-files --others --exclude-standard | grep '\.md$' | xargs -r git add || true
          TRIGGER_SHA=$(git rev-parse --short ${{ gitea.sha }})
          git diff --cached --quiet || git commit -m "chore: regenerate indexes, pending events, and PDF sidecars (from ${TRIGGER_SHA})"
          git push
          git push origin HEAD:mobile

      - name: Notify failure
        if: failure() && secrets.NTFY_URL != ''
        run: |
          FAILED_STEP=""
          [[ "${{ steps.conv_index.outcome }}"    == "failure" ]] && FAILED_STEP="Generate conversation index"
          [[ "${{ steps.proj_indexes.outcome }}"  == "failure" ]] && FAILED_STEP="Generate project indexes"
          [[ "${{ steps.dashboard.outcome }}"     == "failure" ]] && FAILED_STEP="Generate dashboard"
          [[ "${{ steps.pending_events.outcome }}" == "failure" ]] && FAILED_STEP="Generate pending events"
          [[ "${{ steps.pdf_sidecars.outcome }}"  == "failure" ]] && FAILED_STEP="Generate PDF sidecars"
          [[ "${{ steps.commit.outcome }}"        == "failure" ]] && FAILED_STEP="Commit artifacts"
          curl -s \
            -H "Title: Second Brain CI failure" \
            -d "❌ ${FAILED_STEP} failed on ${{ github.ref_name }} — ${{ gitea.server_url }}/${{ gitea.repository }}/actions/runs/${{ gitea.run_number }}" \
            ${{ secrets.NTFY_URL }}/${{ secrets.NTFY_TOPIC }}
